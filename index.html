<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Cyber Blue Login</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 350px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 191, 255, 0.3); /* เปลี่ยนขอบเป็นสีฟ้าอ่อน */
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.2);
            color: white;
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 30px;
            letter-spacing: 2px;
            color: #00BFFF; /* เปลี่ยนหัวข้อเป็นสี Deep Sky Blue */
            text-shadow: 0 0 10px #00BFFF;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label { color: #00BFFF; font-size: 14px; }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00BFFF;
            border-radius: 5px;
            color: #00BFFF;
            outline: none;
            box-sizing: border-box;
        }

        /* ปุ่มหลัก สีฟ้าอ่อน */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #87CEFA; /* Light Sky Blue */
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .login-btn:hover {
            background: #00BFFF;
            box-shadow: 0 0 15px #00BFFF;
        }

        /* ปุ่ม Google สีแดง */
        .google-btn {
            width: 100%;
            padding: 12px;
            background: #EA4335; /* Google Red */
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .google-btn:hover {
            background: #c53929;
            box-shadow: 0 0 15px #EA4335;
        }
    </style>
</head>
<body>

    <canvas id="m"></canvas>

    <div class="login-card">
        <h2>สวัสดี กลิน</h2>
        <div class="input-group">
            <label>Identification</label>
            <input type="text" placeholder="Username...">
        </div>
        <div class="input-group">
            <label>Security Key</label>
            <input type="password" placeholder="••••••••">
        </div>
        
        <!-- ปุ่มที่ใส่คำเตือนไว้ -->
        <button class="login-btn" onclick="showAlert()">ACCESS SYSTEM</button>
        
        <!-- ปุ่ม Google ที่เพิ่มใหม่ -->
        <button class="google-btn">Login with Google</button>
        
        <p style="font-size: 12px; margin-top: 15px; color: #555;">Encrypted Connection</p>
    </div>

    <script>
        // ฟังก์ชันเด้งข้อความคำเตือน
        function showAlert() {
            alert('Access Denied: Hacker Detected!');
        }

        // โค้ด Matrix (เปลี่ยนเป็นสีน้ำเงิน)
        const canvas = document.getElementById('m');
        const ctx = canvas.getContext('2d');
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const letters = "0123456789ABCDEF";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00BFFF"; // เปลี่ยนสีตัวอักษรเป็นสีฟ้า
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
